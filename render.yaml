services:
  - type: web
    name: resolve-ai-api
    runtime: node
    plan: free
    region: virginia
    branch: main
    buildCommand: >-
      npx --yes pnpm@10.34.9 install --frozen-lockfile --prod=false &&
      npx --yes pnpm@10.34.9 db:generate &&
      npx --yes pnpm@10.34.9 build
    startCommand: npm run start:render
    healthCheckPath: /api/health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      - key: SWAGGER_ENABLED
        value: 'false'
      - key: PAYPAL_ENV
        value: sandbox
      - key: TRANSACTION_WORKER_ENABLED
        value: 'true'
      - key: DB_CONNECTION_TIMEOUT_MS
        value: '10000'
      - key: PAYPAL_TIMEOUT_MS
        value: '10000'
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: MERCHANT_ID
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
